# Publishes the page that is live on main as an immutable GitHub release.
#
# 1. Checks that index.html matches the version and SHA-256 recorded in
#    sbom.cdx.json, and that GitHub Pages is serving exactly this file and
#    the PDFs in downloads/.
# 2. Creates Sigstore-signed attestations (keyless signing; the signing
#    identity is this workflow): build provenance for index.html and the
#    PDFs, and the SBOM for index.html.
# 3. Publishes index.html, the PDFs, sbom.cdx.json, SHA256SUMS.txt and the
#    two attestation bundles as an immutable release. GitHub adds its own
#    signed release attestation.
# 4. Sends the SBOM's npm components to the dependency graph, so Dependabot
#    alerts also cover the libraries bundled inside index.html.
#
# Runs only when started by hand on main. Actions are pinned to full commit
# SHAs, the workflow token has no permissions by default, and the job asks
# only for what it needs.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; must match sbom.cdx.json
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Attest and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release; submit the dependency snapshot
      id-token: write # keyless Sigstore signing of the attestations
      attestations: write # store the attestations
    env:
      VERSION: ${{ inputs.version }}
      GH_REPO: ${{ github.repository }}
      SITE: https://araviiindb.github.io/c0c0n-2026-scorecard/
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the page against its SBOM and the live site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3"
            exit 1
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists"
            exit 1
          fi
          sbom_version="$(jq -r '.metadata.component.version' sbom.cdx.json)"
          if [[ "$sbom_version" != "$VERSION" ]]; then
            echo "::error::sbom.cdx.json describes version $sbom_version"
            exit 1
          fi
          want="$(jq -r '.metadata.component.hashes[] | select(.alg == "SHA-256") | .content' sbom.cdx.json)"
          got="$(sha256sum index.html | cut -d ' ' -f 1)"
          if [[ "$want" != "$got" ]]; then
            echo "::error::index.html does not match the SHA-256 in sbom.cdx.json"
            exit 1
          fi
          live="$(curl -fsSL --proto '=https' --tlsv1.2 "${SITE}?release-check=${GITHUB_RUN_ID}" | sha256sum | cut -d ' ' -f 1)"
          if [[ "$live" != "$got" ]]; then
            echo "::error::GitHub Pages is not serving this index.html yet. Wait for the Pages deployment, then run again."
            exit 1
          fi
          mkdir out
          cp index.html sbom.cdx.json out/
          shopt -s nullglob
          pdfs=(downloads/*.pdf)
          if [[ "${#pdfs[@]}" -ne 2 ]]; then
            echo "::error::Expected the 2 PDFs in downloads/, found ${#pdfs[@]}"
            exit 1
          fi
          for pdf in "${pdfs[@]}"; do
            name="$(basename "$pdf")"
            if [[ ! "$name" =~ ^[A-Za-z0-9-]+\.pdf$ ]]; then
              echo "::error::Unexpected file name downloads/$name"
              exit 1
            fi
            sum="$(sha256sum "$pdf" | cut -d ' ' -f 1)"
            live="$(curl -fsSL --proto '=https' --tlsv1.2 "${SITE}downloads/${name}?release-check=${GITHUB_RUN_ID}" | sha256sum | cut -d ' ' -f 1)"
            if [[ "$live" != "$sum" ]]; then
              echo "::error::GitHub Pages is not serving this downloads/$name yet. Wait for the Pages deployment, then run again."
              exit 1
            fi
            cp "$pdf" out/
          done
          (cd out && sha256sum index.html sbom.cdx.json *.pdf > SHA256SUMS.txt)

      - name: Attest build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            out/index.html
            out/*.pdf

      - name: Attest SBOM
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/index.html
          sbom-path: out/sbom.cdx.json

      - name: Publish the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" out/provenance.sigstore.json
          cp "$SBOM_BUNDLE" out/index.html.sbom.sigstore.json
          cat > out/notes.md << EOF
          Immutable release of the page served at $SITE

          To check that the page you were served is this release, use a recent GitHub CLI:

              curl -fsSL -o index.html $SITE
              gh release verify-asset v$VERSION index.html -R $GH_REPO
              gh attestation verify index.html -R $GH_REPO

          The same two gh commands work for the book and IR toolkit PDFs served from ${SITE}downloads/ (use the PDF's file name instead of index.html).

          Assets: index.html (the page), the two PDFs offered on its results page, sbom.cdx.json (CycloneDX SBOM with VEX), SHA256SUMS.txt, the Sigstore bundle of the build-provenance attestation (index.html and the PDFs) and the Sigstore bundle of the SBOM attestation for index.html. SECURITY.md explains these checks.
          EOF
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file out/notes.md \
            out/index.html out/*.pdf out/sbom.cdx.json out/SHA256SUMS.txt \
            out/provenance.sigstore.json out/index.html.sbom.sigstore.json
          gh release edit "v$VERSION" --draft=false

      - name: Verify the release and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh release verify "v$VERSION"; then
              break
            fi
            if [[ "$attempt" == 6 ]]; then
              echo "::error::No valid release attestation for v$VERSION"
              exit 1
            fi
            sleep 10
          done
          gh release verify-asset "v$VERSION" out/index.html
          signer="$GH_REPO/.github/workflows/release.yml"
          gh attestation verify out/index.html --repo "$GH_REPO" --signer-workflow "$signer"
          gh attestation verify out/index.html --repo "$GH_REPO" --signer-workflow "$signer" \
            --predicate-type https://cyclonedx.org/bom
          for pdf in out/*.pdf; do
            gh release verify-asset "v$VERSION" "$pdf"
            gh attestation verify "$pdf" --repo "$GH_REPO" --signer-workflow "$signer"
          done

      - name: Send the SBOM components to the dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - > out/snapshot.json << 'PY'
          import datetime
          import json
          import os

          with open("sbom.cdx.json", encoding="utf-8") as fh:
              sbom = json.load(fh)
          root = sbom["metadata"]["component"]
          deps = {d["ref"]: d.get("dependsOn", []) for d in sbom.get("dependencies", [])}
          direct = set(deps.get(root["bom-ref"], []))
          resolved = {
              ref: {
                  "package_url": ref,
                  "relationship": "direct" if ref in direct else "indirect",
                  "scope": "runtime",
                  "dependencies": children,
              }
              for ref, children in deps.items()
              if ref.startswith("pkg:npm/")
          }
          env = os.environ
          repo_url = f"{env['GITHUB_SERVER_URL']}/{env['GITHUB_REPOSITORY']}"
          print(json.dumps({
              "version": 0,
              "sha": env["GITHUB_SHA"],
              "ref": env["GITHUB_REF"],
              "job": {
                  "correlator": "release sbom.cdx.json",
                  "id": env["GITHUB_RUN_ID"],
                  "html_url": f"{repo_url}/actions/runs/{env['GITHUB_RUN_ID']}",
              },
              "detector": {"name": "sbom.cdx.json", "version": root["version"], "url": repo_url},
              "scanned": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "manifests": {
                  "sbom.cdx.json": {
                      "name": "sbom.cdx.json",
                      "file": {"source_location": "sbom.cdx.json"},
                      "resolved": resolved,
                  }
              },
          }))
          PY
          gh api --method POST "repos/$GH_REPO/dependency-graph/snapshots" --input out/snapshot.json
